name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: cd extension && zip -r ../novablock-extension.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: novablock-extension-pc
          path: novablock-extension.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android test lint assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: novablock-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
